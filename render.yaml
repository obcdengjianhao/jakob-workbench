services:
  - type: web
    name: formula-workbench-cloud
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: workbench-data
      mountPath: /var/data
      sizeGB: 1
